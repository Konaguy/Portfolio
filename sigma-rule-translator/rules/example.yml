title: Encoded PowerShell Execution
id: 3d4e5f6a-1b2c-4d5e-8f9a-0b1c2d3e4f5a
status: test
description: >
  Detects PowerShell invoked with encoding or hidden-window flags commonly
  used to evade logging. Mirrors CD-02 / SR-02 in the
  security-automation-soar project.
author: Portfolio example
date: 2026-09-22
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense_evasion
  - attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\powershell.exe'
    CommandLine|contains:
      - '-enc'
      - '-EncodedCommand'
      - 'FromBase64String'
      - '-w hidden'
      - '-noni'
  condition: selection
falsepositives:
  - Legitimate automation scripts that pass encoded commands
level: medium
