[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "falcon-rtr-toolkit"
version = "0.1.0"
description = "Tested Python wrapper around the CrowdStrike Falcon API for common incident-response actions (containment, RTR commands, detection status updates)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "crowdstrike-falconpy>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["falcon_rtr*"]
