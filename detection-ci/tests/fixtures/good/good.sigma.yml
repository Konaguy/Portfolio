title: Suspicious Rundll32 Execution
id: 7a1b2c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
status: test
description: Detects rundll32 launching from a user-writable path.
author: Portfolio
date: 2026-09-27
tags:
  - attack.defense_evasion
  - attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\rundll32.exe'
    CommandLine|contains:
      - '\appdata\'
      - '\temp\'
  condition: selection
level: high
