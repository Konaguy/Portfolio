# Microsoft Sentinel scheduled analytics rules (Azure-Sentinel content-repo shape).
# Deploy each list item via the Sentinel content pipeline, the alertRules ARM API
# (Microsoft.SecurityInsights/alertRules), or Sentinel Repositories (GitHub/DevOps).
# Table and column names follow the Sentinel convention (TimeGenerated). The two
# Entra ID-sourced rules (SR-11 impossible travel, SR-12 password spray) query
# SigninLogs instead of the Defender IdentityLogonEvents schema.
#
# Response automation: Sentinel executes response actions through automation
# rules + Logic App playbooks triggered on incident creation, not inline in the
# rule. The playbook to bind per rule is noted in each description
# (e.g. PB-Isolate-Device, PB-Disable-User, PB-Collect-Package) so the mapping to
# the Defender auto-actions stays 1:1. Gate the high-impact playbooks behind an
# approval step until thresholds are tuned for your environment.

- id: 5c3f9a10-1a2b-4c3d-9e10-0a1b2c3d0001
  name: SR-01 Ransomware - mass file encryption behavior
  description: |
    A single process modified/renamed 200+ files in 5 minutes with encryption-style
    extensions. Bind PB-Isolate-Device (full isolation) on incident creation.
  severity: High
  status: Available
  requiredDataConnectors:
    - connectorId: MicrosoftThreatProtection
      dataTypes:
        - DeviceFileEvents
  queryFrequency: 5m
  queryPeriod: 1h
  triggerOperator: gt
  triggerThreshold: 0
  tactics:
    - Impact
  relevantTechniques:
    - T1486
  query: |
    DeviceFileEvents
    | where TimeGenerated > ago(1h)
    | where ActionType in ("FileRenamed", "FileModified")
    | where FileName matches regex @"(?i)\.(locked|crypt|encrypted|enc|[a-z0-9]{6,10})$"
    | summarize AffectedFiles = dcount(FolderPath), StartTime = min(TimeGenerated), EndTime = max(TimeGenerated)
        by DeviceId, DeviceName, InitiatingProcessId, InitiatingProcessFileName, InitiatingProcessAccountUpn, bin(TimeGenerated, 5m)
    | where AffectedFiles >= 200
  entityMappings:
    - entityType: Host
      fieldMappings:
        - identifier: HostName
          columnName: DeviceName
    - entityType: Account
      fieldMappings:
        - identifier: FullName
          columnName: InitiatingProcessAccountUpn
    - entityType: Process
      fieldMappings:
        - identifier: ProcessId
          columnName: InitiatingProcessId
  incidentConfiguration:
    createIncident: true
    groupingConfiguration:
      enabled: true
      reopenClosedIncident: false
      lookbackDuration: 5h
      matchingMethod: Selected
      groupByEntities:
        - Host
  version: 1.0.0
  kind: Scheduled

- id: 5c3f9a10-1a2b-4c3d-9e10-0a1b2c3d0002
  name: SR-02 Credential dumping - LSASS memory access
  description: |
    Non-system process opened or read LSASS memory (Mimikatz / comsvcs / procdump).
    Bind PB-Isolate-Device (full) and PB-Collect-Package on incident creation.
  severity: High
  status: Available
  requiredDataConnectors:
    - connectorId: MicrosoftThreatProtection
      dataTypes:
        - DeviceEvents
  queryFrequency: 15m
  queryPeriod: 1h
  triggerOperator: gt
  triggerThreshold: 0
  tactics:
    - CredentialAccess
  relevantTechniques:
    - T1003.001
  query: |
    DeviceEvents
    | where TimeGenerated > ago(1h)
    | where ActionType in ("OpenProcessApiCall", "ReadProcessMemoryApiCall")
    | where FileName =~ "lsass.exe"
    | where InitiatingProcessFolderPath !has @"\windows\system32\"
    | where InitiatingProcessFileName !in~ ("MsMpEng.exe", "csrss.exe", "wininit.exe", "services.exe")
    | project TimeGenerated, DeviceId, DeviceName, InitiatingProcessId, InitiatingProcessFileName, InitiatingProcessCommandLine, InitiatingProcessAccountUpn
  entityMappings:
    - entityType: Host
      fieldMappings:
        - identifier: HostName
          columnName: DeviceName
    - entityType: Account
      fieldMappings:
        - identifier: FullName
          columnName: InitiatingProcessAccountUpn
    - entityType: Process
      fieldMappings:
        - identifier: ProcessId
          columnName: InitiatingProcessId
  incidentConfiguration:
    createIncident: true
    groupingConfiguration:
      enabled: true
      reopenClosedIncident: false
      lookbackDuration: 5h
      matchingMethod: Selected
      groupByEntities:
        - Host
  version: 1.0.0
  kind: Scheduled

- id: 5c3f9a10-1a2b-4c3d-9e10-0a1b2c3d0003
  name: SR-03 Office application spawned suspicious child process
  description: |
    Office app launched a scripting / LOLBin process (malicious macro pattern).
    Bind PB-Isolate-Device (selective) on incident creation.
  severity: High
  status: Available
  requiredDataConnectors:
    - connectorId: MicrosoftThreatProtection
      dataTypes:
        - DeviceProcessEvents
  queryFrequency: 15m
  queryPeriod: 1h
  triggerOperator: gt
  triggerThreshold: 0
  tactics:
    - Execution
    - InitialAccess
  relevantTechniques:
    - T1204.002
    - T1566.001
  query: |
    DeviceProcessEvents
    | where TimeGenerated > ago(1h)
    | where InitiatingProcessFileName in~ ("winword.exe", "excel.exe", "powerpnt.exe", "outlook.exe", "mspub.exe", "onenote.exe")
    | where FileName in~ ("powershell.exe", "pwsh.exe", "cmd.exe", "wscript.exe", "cscript.exe", "mshta.exe", "rundll32.exe", "regsvr32.exe", "certutil.exe", "bitsadmin.exe")
    | project TimeGenerated, DeviceId, DeviceName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine, AccountUpn
  entityMappings:
    - entityType: Host
      fieldMappings:
        - identifier: HostName
          columnName: DeviceName
    - entityType: Account
      fieldMappings:
        - identifier: FullName
          columnName: AccountUpn
  incidentConfiguration:
    createIncident: true
    groupingConfiguration:
      enabled: true
      reopenClosedIncident: false
      lookbackDuration: 5h
      matchingMethod: Selected
      groupByEntities:
        - Host
  version: 1.0.0
  kind: Scheduled

- id: 5c3f9a10-1a2b-4c3d-9e10-0a1b2c3d0004
  name: SR-04 Obfuscated / encoded PowerShell execution
  description: |
    PowerShell ran with encoded, hidden, or download-and-execute patterns.
    Bind PB-Collect-Package on incident creation.
  severity: Medium
  status: Available
  requiredDataConnectors:
    - connectorId: MicrosoftThreatProtection
      dataTypes:
        - DeviceProcessEvents
  queryFrequency: 1h
  queryPeriod: 1h
  triggerOperator: gt
  triggerThreshold: 0
  tactics:
    - Execution
    - DefenseEvasion
  relevantTechniques:
    - T1059.001
    - T1027
  query: |
    DeviceProcessEvents
    | where TimeGenerated > ago(1h)
    | where FileName in~ ("powershell.exe", "pwsh.exe")
    | where ProcessCommandLine has_any ("-enc", "-encodedcommand", "frombase64string", "-w hidden", "-windowstyle hidden", "iex", "invoke-expression", "downloadstring", "downloadfile", "-nop", "-noprofile")
    | where ProcessCommandLine matches regex @"(?i)-e(nc(odedcommand)?)?\s+[A-Za-z0-9+/=]{40,}"
        or ProcessCommandLine has_any ("downloadstring", "downloadfile", "frombase64string")
    | project TimeGenerated, DeviceId, DeviceName, FileName, ProcessCommandLine, InitiatingProcessFileName, AccountUpn
  entityMappings:
    - entityType: Host
      fieldMappings:
        - identifier: HostName
          columnName: DeviceName
    - entityType: Account
      fieldMappings:
        - identifier: FullName
          columnName: AccountUpn
  incidentConfiguration:
    createIncident: true
    groupingConfiguration:
      enabled: true
      reopenClosedIncident: false
      lookbackDuration: 5h
      matchingMethod: Selected
      groupByEntities:
        - Host
  version: 1.0.0
  kind: Scheduled

- id: 5c3f9a10-1a2b-4c3d-9e10-0a1b2c3d0005
  name: SR-05 Inhibit recovery - volume shadow copy deletion
  description: |
    Process deleted shadow copies or disabled recovery (ransomware precursor).
    Bind PB-Isolate-Device (full) on incident creation.
  severity: High
  status: Available
  requiredDataConnectors:
    - connectorId: MicrosoftThreatProtection
      dataTypes:
        - DeviceProcessEvents
  queryFrequency: 5m
  queryPeriod: 1h
  triggerOperator: gt
  triggerThreshold: 0
  tactics:
    - Impact
  relevantTechniques:
    - T1490
  query: |
    DeviceProcessEvents
    | where TimeGenerated > ago(1h)
    | where (FileName =~ "vssadmin.exe" and ProcessCommandLine has "delete" and ProcessCommandLine has "shadows")
        or (FileName =~ "wmic.exe" and ProcessCommandLine has "shadowcopy" and ProcessCommandLine has "delete")
        or (FileName =~ "wbadmin.exe" and ProcessCommandLine has "delete")
        or (FileName =~ "bcdedit.exe" and ProcessCommandLine has_any ("recoveryenabled no", "bootstatuspolicy ignoreallfailures"))
    | project TimeGenerated, DeviceId, DeviceName, FileName, ProcessCommandLine, InitiatingProcessFileName, AccountUpn
  entityMappings:
    - entityType: Host
      fieldMappings:
        - identifier: HostName
          columnName: DeviceName
    - entityType: Account
      fieldMappings:
        - identifier: FullName
          columnName: AccountUpn
  incidentConfiguration:
    createIncident: true
    groupingConfiguration:
      enabled: true
      reopenClosedIncident: false
      lookbackDuration: 5h
      matchingMethod: Selected
      groupByEntities:
        - Host
  version: 1.0.0
  kind: Scheduled

- id: 5c3f9a10-1a2b-4c3d-9e10-0a1b2c3d0006
  name: SR-06 Persistence - suspicious scheduled task creation
  description: |
    Scheduled task created to run a scripting engine or a binary from a
    user-writable path. Enrichment/ticket only; no auto-containment.
  severity: Medium
  status: Available
  requiredDataConnectors:
    - connectorId: MicrosoftThreatProtection
      dataTypes:
        - DeviceProcessEvents
  queryFrequency: 1h
  queryPeriod: 1h
  triggerOperator: gt
  triggerThreshold: 0
  tactics:
    - Persistence
  relevantTechniques:
    - T1053.005
  query: |
    DeviceProcessEvents
    | where TimeGenerated > ago(1h)
    | where FileName =~ "schtasks.exe" and ProcessCommandLine has "/create"
    | where ProcessCommandLine has_any ("powershell", "cmd", "wscript", "cscript", "mshta", "rundll32", "regsvr32", @"\users\public", @"\appdata\", @"\programdata\", "-enc", "downloadstring")
    | project TimeGenerated, DeviceId, DeviceName, FileName, ProcessCommandLine, InitiatingProcessFileName, AccountUpn
  entityMappings:
    - entityType: Host
      fieldMappings:
        - identifier: HostName
          columnName: DeviceName
    - entityType: Account
      fieldMappings:
        - identifier: FullName
          columnName: AccountUpn
  incidentConfiguration:
    createIncident: true
    groupingConfiguration:
      enabled: true
      reopenClosedIncident: false
      lookbackDuration: 5h
      matchingMethod: Selected
      groupByEntities:
        - Host
  version: 1.0.0
  kind: Scheduled

- id: 5c3f9a10-1a2b-4c3d-9e10-0a1b2c3d0007
  name: SR-07 Persistence - registry Run key autorun modification
  description: |
    Registry Run/Winlogon autostart value set to a suspicious path or interpreter.
    Enrichment/ticket only.
  severity: Low
  status: Available
  requiredDataConnectors:
    - connectorId: MicrosoftThreatProtection
      dataTypes:
        - DeviceRegistryEvents
  queryFrequency: 1h
  queryPeriod: 1h
  triggerOperator: gt
  triggerThreshold: 0
  tactics:
    - Persistence
  relevantTechniques:
    - T1547.001
  query: |
    DeviceRegistryEvents
    | where TimeGenerated > ago(1h)
    | where ActionType in ("RegistryValueSet", "RegistryKeyCreated")
    | where RegistryKey has_any (@"\CurrentVersion\Run", @"\CurrentVersion\RunOnce", @"\Winlogon\Shell", @"\Winlogon\Userinit")
    | where RegistryValueData has_any (@"\appdata\", @"\programdata\", @"\users\public", @"\temp\", "powershell", "mshta", "rundll32", "regsvr32", "-enc")
    | project TimeGenerated, DeviceId, DeviceName, RegistryKey, RegistryValueName, RegistryValueData, InitiatingProcessFileName, InitiatingProcessAccountUpn
  entityMappings:
    - entityType: Host
      fieldMappings:
        - identifier: HostName
          columnName: DeviceName
    - entityType: Account
      fieldMappings:
        - identifier: FullName
          columnName: InitiatingProcessAccountUpn
  incidentConfiguration:
    createIncident: true
    groupingConfiguration:
      enabled: true
      reopenClosedIncident: false
      lookbackDuration: 24h
      matchingMethod: Selected
      groupByEntities:
        - Host
  version: 1.0.0
  kind: Scheduled

- id: 5c3f9a10-1a2b-4c3d-9e10-0a1b2c3d0008
  name: SR-08 Lateral movement - remote service / PsExec execution
  description: |
    PsExec-style remote service creation or execution. Bind PB-Collect-Package
    on incident creation.
  severity: Medium
  status: Available
  requiredDataConnectors:
    - connectorId: MicrosoftThreatProtection
      dataTypes:
        - DeviceProcessEvents
  queryFrequency: 1h
  queryPeriod: 1h
  triggerOperator: gt
  triggerThreshold: 0
  tactics:
    - LateralMovement
    - Execution
  relevantTechniques:
    - T1021.002
    - T1569.002
  query: |
    DeviceProcessEvents
    | where TimeGenerated > ago(1h)
    | where (FileName in~ ("psexec.exe", "psexesvc.exe", "paexec.exe"))
        or (InitiatingProcessFileName =~ "services.exe" and ProcessCommandLine has_any ("-s -d -f", "cmd.exe /c", "powershell") and FolderPath has_any (@"\windows\", @"\temp\"))
        or (FileName =~ "sc.exe" and ProcessCommandLine has_any (@"\\", "create", "binpath"))
    | project TimeGenerated, DeviceId, DeviceName, FileName, ProcessCommandLine, InitiatingProcessFileName, AccountUpn
  entityMappings:
    - entityType: Host
      fieldMappings:
        - identifier: HostName
          columnName: DeviceName
    - entityType: Account
      fieldMappings:
        - identifier: FullName
          columnName: AccountUpn
  incidentConfiguration:
    createIncident: true
    groupingConfiguration:
      enabled: true
      reopenClosedIncident: false
      lookbackDuration: 5h
      matchingMethod: Selected
      groupByEntities:
        - Host
  version: 1.0.0
  kind: Scheduled

- id: 5c3f9a10-1a2b-4c3d-9e10-0a1b2c3d0009
  name: SR-09 LOLBin download / ingress tool transfer
  description: |
    Trusted system binary (certutil/bitsadmin/mshta/curl) used to fetch or decode
    a remote file. Enrichment (URL + file reputation); quarantine on match.
  severity: Medium
  status: Available
  requiredDataConnectors:
    - connectorId: MicrosoftThreatProtection
      dataTypes:
        - DeviceProcessEvents
  queryFrequency: 1h
  queryPeriod: 1h
  triggerOperator: gt
  triggerThreshold: 0
  tactics:
    - CommandAndControl
    - DefenseEvasion
  relevantTechniques:
    - T1105
    - T1218
  query: |
    DeviceProcessEvents
    | where TimeGenerated > ago(1h)
    | where (FileName =~ "certutil.exe" and ProcessCommandLine has_any ("-urlcache", "-verifyctl", "-decode"))
        or (FileName =~ "bitsadmin.exe" and ProcessCommandLine has "transfer")
        or (FileName =~ "mshta.exe" and ProcessCommandLine has_any ("http://", "https://", "javascript:", "vbscript:"))
        or (FileName =~ "curl.exe" and ProcessCommandLine has_any ("-o ", "--output") and ProcessCommandLine has_any (@"\temp\", @"\appdata\", @"\programdata\"))
    | project TimeGenerated, DeviceId, DeviceName, FileName, ProcessCommandLine, InitiatingProcessFileName, AccountUpn
  entityMappings:
    - entityType: Host
      fieldMappings:
        - identifier: HostName
          columnName: DeviceName
    - entityType: Account
      fieldMappings:
        - identifier: FullName
          columnName: AccountUpn
  incidentConfiguration:
    createIncident: true
    groupingConfiguration:
      enabled: true
      reopenClosedIncident: false
      lookbackDuration: 5h
      matchingMethod: Selected
      groupByEntities:
        - Host
  version: 1.0.0
  kind: Scheduled

- id: 5c3f9a10-1a2b-4c3d-9e10-0a1b2c3d0010
  name: SR-10 Command-and-control beaconing pattern
  description: |
    Non-browser process making regular, repeated connections to a single public
    host. Bind PB-Collect-Package on incident creation.
  severity: Medium
  status: Available
  requiredDataConnectors:
    - connectorId: MicrosoftThreatProtection
      dataTypes:
        - DeviceNetworkEvents
  queryFrequency: 1h
  queryPeriod: 3h
  triggerOperator: gt
  triggerThreshold: 0
  tactics:
    - CommandAndControl
  relevantTechniques:
    - T1071.001
    - T1571
  query: |
    DeviceNetworkEvents
    | where TimeGenerated > ago(3h)
    | where ActionType == "ConnectionSuccess" and RemoteIPType == "Public"
    | where InitiatingProcessFileName !in~ ("chrome.exe", "msedge.exe", "firefox.exe", "outlook.exe", "teams.exe", "onedrive.exe")
    | summarize Connections = count(), Beats = dcount(bin(TimeGenerated, 1m))
        by DeviceId, DeviceName, InitiatingProcessFileName, RemoteIP, RemoteUrl
    | where Connections >= 30 and Beats >= 20
  entityMappings:
    - entityType: Host
      fieldMappings:
        - identifier: HostName
          columnName: DeviceName
    - entityType: IP
      fieldMappings:
        - identifier: Address
          columnName: RemoteIP
  incidentConfiguration:
    createIncident: true
    groupingConfiguration:
      enabled: true
      reopenClosedIncident: false
      lookbackDuration: 5h
      matchingMethod: Selected
      groupByEntities:
        - IP
        - Host
  version: 1.0.0
  kind: Scheduled

- id: 5c3f9a10-1a2b-4c3d-9e10-0a1b2c3d0011
  name: SR-11 Identity takeover - impossible travel sign-in
  description: |
    Successful Entra ID sign-ins from two distant countries within a window too
    short for travel. Queries SigninLogs. Bind PB-Disable-User + PB-Revoke-Sessions.
  severity: High
  status: Available
  requiredDataConnectors:
    - connectorId: AzureActiveDirectory
      dataTypes:
        - SigninLogs
  queryFrequency: 1h
  queryPeriod: 1h
  triggerOperator: gt
  triggerThreshold: 0
  tactics:
    - InitialAccess
    - CredentialAccess
  relevantTechniques:
    - T1078.004
  query: |
    SigninLogs
    | where TimeGenerated > ago(1h)
    | where ResultType == 0
    | extend Country = tostring(LocationDetails.countryOrRegion), City = tostring(LocationDetails.city)
    | where isnotempty(Country)
    | sort by UserPrincipalName asc, TimeGenerated asc
    | extend PrevCountry = prev(Country), PrevTime = prev(TimeGenerated), PrevUser = prev(UserPrincipalName)
    | where UserPrincipalName == PrevUser and Country != PrevCountry and isnotempty(PrevCountry)
    | extend GapMinutes = datetime_diff('minute', TimeGenerated, PrevTime)
    | where GapMinutes <= 240
    | project TimeGenerated, UserPrincipalName, UserId, Country, PrevCountry, GapMinutes, IPAddress, City
  entityMappings:
    - entityType: Account
      fieldMappings:
        - identifier: FullName
          columnName: UserPrincipalName
        - identifier: AadUserId
          columnName: UserId
    - entityType: IP
      fieldMappings:
        - identifier: Address
          columnName: IPAddress
  incidentConfiguration:
    createIncident: true
    groupingConfiguration:
      enabled: true
      reopenClosedIncident: false
      lookbackDuration: 5h
      matchingMethod: Selected
      groupByEntities:
        - Account
  version: 1.0.0
  kind: Scheduled

- id: 5c3f9a10-1a2b-4c3d-9e10-0a1b2c3d0012
  name: SR-12 Password spray against Entra ID
  description: |
    Single source IP failing auth against many distinct accounts. Queries SigninLogs.
    Bind PB-Block-IP; no auto-disable (high false-positive risk on legitimate NAT).
  severity: Medium
  status: Available
  requiredDataConnectors:
    - connectorId: AzureActiveDirectory
      dataTypes:
        - SigninLogs
  queryFrequency: 1h
  queryPeriod: 1h
  triggerOperator: gt
  triggerThreshold: 0
  tactics:
    - CredentialAccess
  relevantTechniques:
    - T1110.003
  query: |
    SigninLogs
    | where TimeGenerated > ago(1h)
    | where ResultType in (50126, 50053, 50055, 50056)
    | summarize TargetedAccounts = dcount(UserPrincipalName), Attempts = count(), Accounts = make_set(UserPrincipalName, 50)
        by IPAddress, bin(TimeGenerated, 30m)
    | where TargetedAccounts >= 15
  entityMappings:
    - entityType: IP
      fieldMappings:
        - identifier: Address
          columnName: IPAddress
  incidentConfiguration:
    createIncident: true
    groupingConfiguration:
      enabled: true
      reopenClosedIncident: false
      lookbackDuration: 5h
      matchingMethod: Selected
      groupByEntities:
        - IP
  version: 1.0.0
  kind: Scheduled

- id: 5c3f9a10-1a2b-4c3d-9e10-0a1b2c3d0013
  name: SR-13 Privileged directory group membership change
  description: |
    Account added to a highly privileged directory group. Requires Defender for
    Identity feeding IdentityDirectoryEvents. Enrichment + approval ticket.
  severity: High
  status: Available
  requiredDataConnectors:
    - connectorId: MicrosoftThreatProtection
      dataTypes:
        - IdentityDirectoryEvents
  queryFrequency: 1h
  queryPeriod: 1h
  triggerOperator: gt
  triggerThreshold: 0
  tactics:
    - PrivilegeEscalation
    - Persistence
  relevantTechniques:
    - T1098
    - T1078
  query: |
    IdentityDirectoryEvents
    | where TimeGenerated > ago(1h)
    | where ActionType in ("Group Membership changed", "Member added to group", "Security-enabled group member added")
    | extend TargetGroup = tostring(AdditionalFields.["TO.GROUP"])
    | where TargetGroup has_any ("Domain Admins", "Enterprise Admins", "Schema Admins", "Administrators", "Account Operators", "Backup Operators", "Global Administrator", "Privileged Role Administrator")
    | project TimeGenerated, ActionType, TargetGroup, TargetAccountDisplayName, AccountUpn, AccountDisplayName, DeviceName, IPAddress
  entityMappings:
    - entityType: Account
      fieldMappings:
        - identifier: FullName
          columnName: AccountUpn
    - entityType: Account
      fieldMappings:
        - identifier: DisplayName
          columnName: TargetAccountDisplayName
  incidentConfiguration:
    createIncident: true
    groupingConfiguration:
      enabled: true
      reopenClosedIncident: false
      lookbackDuration: 24h
      matchingMethod: Selected
      groupByEntities:
        - Account
  version: 1.0.0
  kind: Scheduled

- id: 5c3f9a10-1a2b-4c3d-9e10-0a1b2c3d0014
  name: SR-14 Kerberoasting - anomalous TGS requests
  description: |
    One account requested service tickets for many SPNs, skewed to weak (RC4)
    encryption. Requires Defender for Identity feeding IdentityLogonEvents.
  severity: Medium
  status: Available
  requiredDataConnectors:
    - connectorId: MicrosoftThreatProtection
      dataTypes:
        - IdentityLogonEvents
  queryFrequency: 1h
  queryPeriod: 1h
  triggerOperator: gt
  triggerThreshold: 0
  tactics:
    - CredentialAccess
  relevantTechniques:
    - T1558.003
  query: |
    IdentityLogonEvents
    | where TimeGenerated > ago(1h)
    | where Protocol == "Kerberos" and LogonType == "Service"
    | extend Encryption = tostring(AdditionalFields.EncryptionType)
    | summarize DistinctSpns = dcount(TargetDeviceName), WeakEnc = countif(Encryption in ("RC4-HMAC", "DES")), Requests = count()
        by AccountUpn, AccountSid, DeviceName, bin(TimeGenerated, 15m)
    | where DistinctSpns >= 10 or (WeakEnc >= 5 and DistinctSpns >= 5)
  entityMappings:
    - entityType: Account
      fieldMappings:
        - identifier: FullName
          columnName: AccountUpn
        - identifier: Sid
          columnName: AccountSid
    - entityType: Host
      fieldMappings:
        - identifier: HostName
          columnName: DeviceName
  incidentConfiguration:
    createIncident: true
    groupingConfiguration:
      enabled: true
      reopenClosedIncident: false
      lookbackDuration: 5h
      matchingMethod: Selected
      groupByEntities:
        - Account
  version: 1.0.0
  kind: Scheduled

- id: 5c3f9a10-1a2b-4c3d-9e10-0a1b2c3d0015
  name: SR-15 Malicious attachment delivered to mailbox
  description: |
    Inbound email with a high-risk or flagged attachment delivered to a mailbox.
    Requires Defender for Office 365 feeding EmailEvents/EmailAttachmentInfo.
    Bind PB-Purge-Email (soft-delete across mailboxes).
  severity: Medium
  status: Available
  requiredDataConnectors:
    - connectorId: MicrosoftThreatProtection
      dataTypes:
        - EmailEvents
        - EmailAttachmentInfo
  queryFrequency: 1h
  queryPeriod: 1h
  triggerOperator: gt
  triggerThreshold: 0
  tactics:
    - InitialAccess
  relevantTechniques:
    - T1566.001
  query: |
    EmailEvents
    | where TimeGenerated > ago(1h)
    | where EmailDirection == "Inbound"
    | where DeliveryAction in ("Delivered", "DeliveredAsSpam")
    | join kind=inner (
        EmailAttachmentInfo
        | where FileType in~ ("exe", "scr", "js", "vbs", "hta", "iso", "img", "lnk", "docm", "xlsm", "pptm", "one")
            or ThreatTypes has_any ("Malware", "Phish")
    ) on NetworkMessageId
    | project TimeGenerated, NetworkMessageId, SenderFromAddress, RecipientEmailAddress, Subject, FileName, FileType, SHA256, ThreatTypes, DeliveryAction
  entityMappings:
    - entityType: Account
      fieldMappings:
        - identifier: FullName
          columnName: RecipientEmailAddress
    - entityType: MailMessage
      fieldMappings:
        - identifier: NetworkMessageId
