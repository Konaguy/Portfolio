[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vuln-management-rag"
version = "0.1.0"
description = "Multi-agent RAG assistant for vulnerability management (Tenable + policy corpus)"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "langgraph>=0.2.28",
    "qdrant-client>=1.9",
    "pydantic>=2.5",
]

[project.optional-dependencies]
frontend = ["chainlit>=1.1"]
embeddings = ["sentence-transformers>=2.6"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["vulnrag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
